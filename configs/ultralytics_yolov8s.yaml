# Ultralytics YOLOv8s training configuration for RDD2022
# Used to compare against the custom scratch implementation

model:
  weights: yolov8s.pt         # COCO-pretrained starting point
  num_classes: 4

training:
  imgsz: 640
  batch: 64
  epochs: 100
  optimizer: AdamW
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  amp: true

loss:
  box: 7.5
  cls: 0.5
  dfl: 1.5

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 1.0

data:
  yaml: ./dataset/rdd2022_yolo/rdd2022.yaml
  num_classes: 4
  class_names:
    0: D00_Longitudinal_Crack
    1: D10_Transverse_Crack
    2: D20_Alligator_Crack
    3: D40_Pothole

results:
  # Achieved results (from paper slide deck)
  mAP_0.50: 0.58
  precision: 0.63
  recall: 0.54
  training_speedup_vs_scratch: "52% faster (pretrained weights)"
